name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # providers/ must be exactly what the generator makes from skills/ and plugin.config.json, for the repository
      # this runs in: a test copy commits files built with its own URL (PLUGIN_REPOSITORY, see ci/generate-providers.mjs).
      - name: Providers are generated and committed
        env:
          PLUGIN_REPOSITORY: https://github.com/${{ github.repository }}
        run: |
          node ci/generate-providers.mjs
          git diff --exit-code -- providers .mcp.json .claude-plugin .agents || {
            echo "::error::providers/ is out of date: run node ci/generate-providers.mjs and commit the result"
            exit 1
          }
          test -z "$(git status --porcelain -- providers)" || {
            echo "::error::the generator created files that are not committed"
            git status --porcelain -- providers
            exit 1
          }

      - name: Structure, versions, URLs and secrets
        run: node ci/validate-structure.mjs

      - name: Claude plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate --strict providers/claude/plugin
          claude plugin validate --strict .

  # The behavioural evals cost model spend per run and need a Claude credential, so they run by hand for now:
  # see evals/README.md. To run them here, add a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret and a job like:
  #   claude plugin eval . --runs 1 --ablation none --no-publish --trust-plugin --threshold 0.8
